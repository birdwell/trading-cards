# Standard Dependabot config: one weekly grouped PR across every ecosystem
# (majors included), plus grouped security-update PRs per ecosystem.
version: 2

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    ignore:
      # `typescript` is the TypeScript 6 compiler API (ts-jest and Next).
      # TypeScript 7 is installed as @typescript/native for `tsc`.
      # Do not replace the `typescript` package with TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript/native"
        update-types: ["version-update:semver-major"]
      # @types/node stays on 22 to match engines.node; later majors are ignored.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Next.js stays on 16. The next app-router major is ignored.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # Tailwind CSS stays on v4. The next major is ignored.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # Paired Tailwind packages stay on the v4 major.
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]
      # AI SDK stays on 7. The next major is ignored until a dedicated migration.
      - dependency-name: "ai"
        update-types: ["version-update:semver-major"]
      # Paired AI SDK packages stay on the majors that ship with AI SDK 7.
      - dependency-name: "@ai-sdk/*"
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
